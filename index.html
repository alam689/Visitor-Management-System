<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foyer — Visitor Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>

<script>
  // Reveal content instantly when the tab is hidden (animations would otherwise
  // freeze at their first frame). Entrance animations play only on a visible tab.
  (function () {
    function sync() {
      document.documentElement.classList.toggle("no-anim", document.visibilityState === "hidden");
    }
    document.addEventListener("visibilitychange", sync);
    sync();
  })();
</script>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
